<div class="dashboard-shell-custom">
  <app-sidebar-navigation
    [isOpen]="isSidebarOpen"
    (navigationSelected)="handleNavigationSelected()"
  ></app-sidebar-navigation>

  @if (isSidebarOpen) {
    <button
      type="button"
      class="sidebar-backdrop-custom"
      aria-label="Fechar menu de navegação"
      (click)="closeSidebar()"
    ></button>
  }

  <div
    class="dashboard-workspace-custom"
    [class.dashboard-workspace-custom--sidebar-open]="isSidebarOpen"
  >
    <app-header
      [isSidebarOpen]="isSidebarOpen"
      [pageTitle]="pageTitle"
      (sidebarToggle)="toggleSidebar()"
    ></app-header>

    <main class="dashboard-content-custom">
      <ng-content></ng-content>
    </main>
  </div>
</div>
