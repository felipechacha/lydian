<nav class="pagination-custom" [attr.aria-label]="ariaLabel">
  <p class="pagination-summary-custom" aria-live="polite">
    Exibindo {{ firstVisibleItem }}–{{ lastVisibleItem }} de {{ totalItems }}
  </p>

  <div class="pagination-controls-custom">
    <button
      type="button"
      class="pagination-direction-custom"
      [disabled]="currentPage <= 1"
      aria-label="Ir para a página anterior"
      (click)="selectPage(currentPage - 1)"
    >
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      <span>Anterior</span>
    </button>

    <div class="pagination-pages-custom" aria-label="Páginas disponíveis">
      @for (page of visiblePages; track page) {
        <button
          type="button"
          [class.is-active]="page === currentPage"
          [attr.aria-current]="page === currentPage ? 'page' : null"
          [attr.aria-label]="'Ir para a página ' + page"
          (click)="selectPage(page)"
        >
          {{ page }}
        </button>
      }
    </div>

    <button
      type="button"
      class="pagination-direction-custom"
      [disabled]="currentPage >= totalPages"
      aria-label="Ir para a próxima página"
      (click)="selectPage(currentPage + 1)"
    >
      <span>Próxima</span>
      <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
    </button>
  </div>
</nav>
