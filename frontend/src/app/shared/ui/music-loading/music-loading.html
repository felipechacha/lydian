<div
  class="music-loading-minimal-custom"
  role="status"
  aria-live="polite"
  aria-busy="true"
  [attr.aria-label]="message() + '. ' + detail()"
>
  <div [class]="applyWaveClass()" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="music-loading-minimal-copy-custom">
    <strong>{{ message() }}</strong>
    <span>{{ detail() }}</span>
  </div>
</div>
