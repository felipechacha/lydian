<article class="skill-matrix-custom">
  <header class="skill-matrix-header-custom">
    <div>
      <h2>Matriz de Habilidades</h2>
      <p>Distribuição do tempo registrado por técnica</p>
    </div>
    <button type="button" aria-label="Expandir matriz de habilidades">
      <span class="material-symbols-outlined" aria-hidden="true">fullscreen</span>
    </button>
  </header>

  <div class="skill-chart-custom" role="img" [attr.aria-label]="accessibilitySummary">
    <div class="skill-chart-pattern-custom" aria-hidden="true"></div>
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <polygon
        class="skill-grid-outer-custom"
        points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60"
      />
      <polygon class="skill-grid-custom" points="100,40 152,70 152,130 100,160 48,130 48,70" />
      <polygon
        class="skill-grid-custom"
        points="100,60 134.6,80 134.6,120 100,140 65.4,120 65.4,80"
      />
      <line x1="100" y1="20" x2="100" y2="180" />
      <line x1="30.7" y1="60" x2="169.3" y2="140" />
      <line x1="169.3" y1="60" x2="30.7" y2="140" />
      <polygon class="skill-data-custom" [attr.points]="dataPoints" />

      @for (point of chartPoints; track $index) {
        <circle
          class="skill-point-custom"
          [attr.cx]="point.horizontal"
          [attr.cy]="point.vertical"
          r="3"
        />
      }
    </svg>

    @for (skill of skills; track skill.label) {
      <span [class]="applyLabelStyle(skill)">{{ skill.label }}</span>
    }
  </div>
</article>
