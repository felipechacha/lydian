<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title description"><title id="title">Novos caminhos, em breve</title><desc id="description">Ilustração funcional esquemática. Curadoria em preparação. Conteúdo de exemplo. Retorne ao painel.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#273952"/><stop offset="1" stop-color="#10182b"/></linearGradient><linearGradient id="cover" x2="1" y2="1"><stop stop-color="#a88ee5"/><stop offset="1" stop-color="#4d6788"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="640" rx="24" fill="#eaf0f5" stroke="none"/><rect x="26" y="28" width="1068" height="530" rx="20" fill="url(#bg)" stroke="none"/><text x="52" y="62" font-size="12" fill="#c4b7ed" font-weight="700">LYDIAN  /  GUIA VISUAL</text><text x="1040" y="62" font-size="16" fill="#8f9bb2" font-weight="400">•••</text><path d="M48 80L1070 80" stroke="#374760" stroke-width="2" fill="none" stroke-dasharray=""/><text x="58" y="122" font-size="27" fill="#f5f5fa" font-weight="700">Novos caminhos, em breve</text><text x="58" y="150" font-size="13" fill="#aab8ce" font-weight="400">/discover</text><circle cx="560" cy="284" r="61" fill="#b5a1e4"/><path d="M552 302V263L584 256V296M552 264L584 257" stroke="#d5ee88" stroke-width="4" fill="none"/><ellipse cx="547" cy="301" rx="10" ry="7" fill="#d5ee88"/><ellipse cx="579" cy="295" rx="10" ry="7" fill="#d5ee88"/><text x="354" y="393" font-size="28" fill="#f2f4fa" font-weight="650">Um espaço em preparação</text><text x="360" y="430" font-size="16" fill="#a7bad3" font-weight="400">Conteúdo de apresentação, sem serviço ativo</text><rect x="434" y="459" width="252" height="39" rx="12" fill="#d5ee88" stroke="none"/><text x="461" y="485" font-size="14" fill="#172334" font-weight="650">Voltar à experiência real</text><circle cx="70" cy="591" r="17" fill="#d5ee88"/><text x="65" y="597" font-size="1