30" height="130" rx="14" fill="#edf0f4" stroke="#d3dbe6"/><rect x="520" y="1400" width="5" height="130" rx="2" fill="#b6becc" stroke="none"/><text x="536" y="1430" font-size="17" fill="#697588" font-weight="700">Biblioteca legada</text><text x="536" y="1452" font-size="11" fill="#74618f" font-weight="400">/library</text><text x="536" y="1480" font-size="12" fill="#52647c" font-weight="400">Acesso direto, fora do menu</text><text x="536" y="1500" font-size="12" fill="#52647c" font-weight="400">Página de apresentação</text><text x="45" y="1590" font-size="12" fill="#657388" font-weight="700">CONTÍNUO = NAVEGAÇÃO / AÇÃO       TRACEJADO = RETORNO DE FLUXO       CINZA = DEMONSTRAÇÃO / LEGADO</text><text x="45" y="1623" font-size="16" fill="#52647c" font-weight="400">Concluir uma prática salva o registro; novas consultas refletem os dados no histórico e nos indicadores.</text><text x="45" y="1653" font-size="14" fill="#657388" font-weight="400">Logout pelo Header retorna ao login. O mapa descreve caminhos de interface, não uma regra de proteção de rotas.</text></svg>