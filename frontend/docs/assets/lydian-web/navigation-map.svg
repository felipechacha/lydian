itar link</text><text x="896" y="182" font-size="11" fill="#74618f" font-weight="400">/reset-password</text><text x="896" y="210" font-size="12" fill="#52647c" font-weight="400">E-mail de recuperação</text><rect x="1155" y="130" width="230" height="125" rx="14" fill="#fff" stroke="#d3dbe6"/><rect x="1155" y="130" width="5" height="125" rx="2" fill="#bba6df" stroke="none"/><text x="1171" y="160" font-size="17" fill="#223653" font-weight="700">Nova senha</text><text x="1171" y="182" font-size="11" fill="#74618f" font-weight="400">/reset-password/confirm</text><text x="1171" y="210" font-size="12" fill="#52647c" font-weight="400">Reset → novo login</text><rect x="45" y="590" width="175" height="145" rx="14" fill="#fff" stroke="#d3dbe6"/><rect x="45" y="590" width="5" height="145" rx="2" fill="#bba6df" stroke="none"/><text x="61" y="620" font-size="17" fill="#223653" font-weight="700">Painel</text><text x="61" y="642" font-size="11" fill="#74618f" font-weight="400">/home</text><text x="61" y="670" font-size="12" fill="#52647c" font-weight="400">Meta diária</text><text x="61" y="690" font-size="12" fill="#52647c" font-weight="400">Sequência</text><text x="61" y="710" font-size="12" fill="#52647c" font-weight="400">Práticas recentes</text><rect x="240" y="590" width="175" height="145" rx="14" fill="#fff" stroke="#d3dbe6"/><rect x="240" y="590" width="5" height="145" rx="2" fill="#bba6df" stroke="none"/><text x="256" y="620" font-size="17" fill="#223653" font-weight="700">Biblioteca</text><text x="256" y="642" font-size="11" fill="#74618f" font-weight="400">/musics</text><text x="256" y="670" font-size="12" fill="#52647c" font-weight="400">Repertório</text><text x="256" y="690" font-size="12" fill="#52647c" font-weight="400">Filtros locais</text><text x="256" y="710" font-size="12" fill="#52647c" font-weight="400">Grade / lista</text><rect x="435" y="590" width="175" height="145" rx="14" fill="#fff" stroke="#d3dbe6"/><rect x="435" y="590" width="5" height="145" rx="2" fill