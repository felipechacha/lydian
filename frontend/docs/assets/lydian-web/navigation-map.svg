<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1700" viewBox="0 0 1440 1700" role="img" aria-labelledby="title description"><title id="title">Mapa completo de navegação do Lydian</title><desc id="description">As 19 páginas: acesso, sete destinos do menu, criação e detalhe de música, prática, detalhe de histórico, setlist, palco e biblioteca legada. Retornos de fluxo indicados por linhas tracejadas.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#273952"/><stop offset="1" stop-color="#10182b"/></linearGradient><linearGradient id="cover" x2="1" y2="1"><stop stop-color="#a88ee5"/><stop offset="1" stop-color="#4d6788"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}</style><rect x="0" y="0" width="1440" height="1700" rx="20" fill="#f5f7fa" stroke="none"/><text x="45" y="55" font-size="14" fill="#655189" font-weight="750">MAPA DE NAVEGAÇÃO</text><text x="45" y="92" font-size="30" fill="#18263b" font-weight="700">Das páginas de acesso à rotina musical.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#74849c"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9c83bc"/></marker></defs><path d="M285 192H330" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M560 192H605" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M835 192H880" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M1110 192H1155" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M170 130V112H720V130" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="360" y="108" font-size="12" fill="#62748a" font-weight="400">Acessar uma conta existente</text><path d="M1270 255V316H720V255" fill="none" stroke="#9c83bc" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#return)"/><text x="877" y="305" font-size="14" fill="#806099" font-weight="400">Senha redefinida: voltar ao login</text><path d="M720 255V390" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="45" y="390" width="1345" height="115" rx="16" fill="#e8e1f4" stroke="#cfc3e3"/><text x="78" y="427" font-size="17" fill="#4e396e" font-weight="750">ÁREA DO APP · SHELL E MENU LATERAL</text><text x="78" y="460" font-size="17" fill="#5d5871" font-weight="400">Login abre /home. A navegação lateral oferece os sete destinos abaixo.</text><path d="M135 540L1300 540" stroke="#74849c" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M718 505L718 540" stroke="#74849c" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M132.5 540V590" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M327.5 540V590" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M522.5 540V590" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M717.5 540V590" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M912.5 540V590" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M1107.5 540V590" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M1302.5 540V590" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M132 735V772H522V735" fill="none" stroke="#74849c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="241" y="766" font-size="12" fill="#62748a" font-weight="400">Abrir histórico</text><path d="M132 735V825H32V1215